name: Diagnose Bookstore Page Layout

# 일회성 진단용 워크플로입니다. Supabase에는 전혀 쓰지 않는 읽기 전용
# 스크립트만 실행하며, 자동 스케줄(cron)은 없고 수동 실행(workflow_dispatch)만
# 가능합니다. 조사가 끝나면 이 워크플로와 diagnose_*.py 스크립트는 삭제할
# 예정입니다.

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install playwright
          playwright install chromium

      - name: Diagnose Kyobo layout
        continue-on-error: true
        run: python diagnose_kyobo_layout.py

      - name: Diagnose Aladin layout
        continue-on-error: true
        run: python diagnose_aladin_layout.py
