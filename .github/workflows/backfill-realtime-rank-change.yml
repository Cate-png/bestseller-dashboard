name: Backfill Realtime Rank Change

# ISBN13 충돌 버그(test_save_*_realtime.py의 get_previous_realtime_ranks()
# 수정 건 - 같은 ISBN13을 공유하는 종이책/전자책이 한 회차에 함께 있으면
# 서로의 순위를 덮어써 rank_change가 잘못 계산되던 문제)로 과거에 잘못
# 저장된 realtime_rankings.rank_change 값을 소급 수정하는 일회성
# 워크플로입니다. backfill_realtime_rank_change.py만 실행하며, 그 스크립트가
# 실제로 건드리는 것은 realtime_rankings의 rank_change 컬럼뿐입니다(수집
# 로직, 스키마, 다른 컬럼, 다른 워크플로는 전혀 건드리지 않음).
#
# apply=false(기본값)면 무엇이 바뀔지만 보여주는 드라이런이고, DB에는 아무
# 것도 쓰지 않습니다. 실제로 반영하려면 실행 시 apply를 true로 선택해야
# 합니다. 수동 실행만 가능하고 스케줄은 없습니다.

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "true로 설정하면 실제로 DB에 반영합니다(기본은 드라이런)"
        required: false
        default: "false"
        type: boolean

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install supabase

      - name: Run backfill (dry-run unless apply=true)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          if [ "${{ inputs.apply }}" = "true" ]; then
            python backfill_realtime_rank_change.py --apply
          else
            python backfill_realtime_rank_change.py
          fi
