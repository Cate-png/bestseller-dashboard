name: Realtime Bestseller Collection

# 실시간 베스트셀러(교보문고 "실시간 베스트셀러", 예스24 "실시간베스트",
# 알라딘 "지금 베스트") 전용 워크플로입니다. 기존 collect.yml(매일 06시
# KST, 주간/분야별 수집)과는 완전히 별개이며, 서로 다른 파일이라 이 파일이
# 실패하거나 스케줄이 바뀌어도 collect.yml에는 전혀 영향이 없습니다.
# 매시 00분/30분, 30분 간격으로 실행됩니다(2026-08-24부터, 아래 참고).
# 저장 대상도 realtime_rankings/realtime_collection_runs
# 테이블로 완전히 분리되어 있어 주간 rankings 테이블과 섞이지 않습니다.
#
# 서점별로 job을 분리해 병렬 실행합니다(collect.yml과 동일한 구조).
#
# 2026-08-23: 원래는 GitHub Actions의 schedule 트리거(cron)를 썼습니다
# (처음엔 매시 1분, 이후 5분 간격으로도 시도). 하지만 실행 이력을
# 조사해보니 GitHub 공식 문서("The schedule event can be delayed
# during periods of high loads... some queued jobs may be dropped")
# 그대로, 5분 간격으로 촘촘히 잡아도 몇 시간씩 schedule 이벤트 자체가
# 한 번도 발화하지 않는 사례가 반복됐습니다(예: 13:01 회차 자체가 아예
# 생성되지 않아 13시 데이터가 통째로 빔). GitHub이 "누락된 슬롯을 다음
# 슬롯이 대신 채워주는" 보충 메커니즘은 어디에도 없다는 것까지 확인한 뒤,
# schedule 트리거는 완전히 제거하고 외부 cron 서비스가 GitHub REST API
# (POST /repos/{owner}/{repo}/actions/workflows/{id}/dispatches)를
# 호출해 workflow_dispatch로 매시 KST 03분에 이 워크플로를 실행시키는
# 구조로 바꿨습니다. workflow_dispatch는 schedule과 달리 이 "고부하 시
# 드롭" 정책의 적용 대상이 아닌 일반 API 호출이라 훨씬 신뢰할 수
# 있습니다. 크롤링/저장 로직, job 구조는 전혀 바뀌지 않았습니다.
#
# check_realtime_hour_collected.py로 "내 서점의 이번 KST 시간대 데이터가
# 이미 realtime_rankings에 있는지"를 크롤링 직전에 확인해, 있으면
# 크롤링 스텝을 건너뜁니다(아래 각 job의 "Check ..." 스텝 참고). 이제는
# GitHub 내부 다중 슬롯이 아니라 "외부 scheduler가 일시적으로 중복
# 호출하거나 사람이 실수로 workflow_dispatch를 두 번 누르는 경우"에
# 대한 방어로 여전히 필요합니다 - 같은 시간대에는 정상적인 3사 데이터
# 세트가 한 번만 생성된다는 목표를 그대로 유지합니다. collected_at은
# 여전히 각 스크립트가 datetime.now(timezone.utc)로 "실제 수집을 시작한
# 시각"을 그대로 기록하고, Dashboard.jsx의 시간대별(00~23시) 조회
# 로직도 손대지 않았습니다.
#
# 2026-08-24: 실시간 수집 주기를 1시간 -> 30분(매시 00분 + 30분)으로
# 전환했습니다. 이 워크플로 자체(job 구조, 크롤링/파싱/저장 로직)는 전혀
# 바뀌지 않았고, 바뀐 것은 check_realtime_hour_collected.py의 중복 수집
# 판단 단위뿐입니다(시간 단위 -> 30분 슬롯 단위, 파일명은 그대로 두고
# 내부 로직만 좁혔습니다 - 자세한 내용은 그 파일의 모듈 docstring 참고).
# 중요: 이 워크플로는 여전히 cron-job.org 같은 외부 서비스가
# workflow_dispatch를 "호출해줄 때"만 실행됩니다 - 즉 실제 수집이 30분
# 마다 이뤄지려면 그 외부 cron 서비스 쪽 스케줄도 (기존 "매시 KST 03분"
# 1개에서) "매시 00분대/30분대에 각각 1번씩, 총 2개"로 바꿔줘야 합니다.
# 이 저장소 안의 변경만으로는 자동으로 반영되지 않습니다.
#
# concurrency: 외부 scheduler가 일시적으로 중복 호출하거나 수동 실행과
# 겹칠 수 있으므로 그대로 유지합니다. cancel-in-progress를 쓰면
# 크롤링이 중간에 끊겨 일부 서점만 저장된 반쪽 상태가 될 수 있으므로,
# 대신 큐잉(줄서기) 방식을 씁니다 - 실행 중인 워크플로는 절대 취소되지
# 않고, 다음 실행은 그 워크플로가 끝난 뒤에 시작됩니다(그 사이에 새로
# 대기열에 들어온 실행이 더 있으면 그중 가장 최신 것만 남고 나머지
# "아직 시작하지 않은" 대기는 자동으로 대체됩니다 - 이미 시작된
# 크롤링을 끊는 것과는 다릅니다).
on:
  workflow_dispatch:

concurrency:
  group: realtime-collection
  cancel-in-progress: false

jobs:
  kyobo-realtime:
    runs-on: ubuntu-latest
    outputs:
      outcome: ${{ steps.run.outcome }}
      already_collected: ${{ steps.check.outputs.already_collected }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install supabase playwright
          playwright install chromium

      - name: Check if this hour is already collected
        id: check
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python check_realtime_hour_collected.py "교보문고"

      - name: Run Kyobo Realtime
        id: run
        if: steps.check.outputs.already_collected != 'true'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python test_save_kyobo_realtime.py

  yes24-realtime:
    runs-on: ubuntu-latest
    outputs:
      outcome: ${{ steps.run.outcome }}
      already_collected: ${{ steps.check.outputs.already_collected }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install supabase playwright beautifulsoup4
          playwright install chromium

      - name: Check if this hour is already collected
        id: check
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python check_realtime_hour_collected.py "예스24"

      - name: Run Yes24 Realtime
        id: run
        if: steps.check.outputs.already_collected != 'true'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python test_save_yes24_realtime.py

  aladin-realtime:
    runs-on: ubuntu-latest
    outputs:
      outcome: ${{ steps.run.outcome }}
      already_collected: ${{ steps.check.outputs.already_collected }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install supabase playwright beautifulsoup4
          playwright install chromium

      - name: Check if this hour is already collected
        id: check
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python check_realtime_hour_collected.py "알라딘"

      - name: Run Aladin Realtime
        id: run
        if: steps.check.outputs.already_collected != 'true'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python test_save_aladin_realtime.py

  check-overall:
    needs: [kyobo-realtime, yes24-realtime, aladin-realtime]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check overall realtime collection result
        run: |
          # already_collected=true인 서점은 이번 실행에서 크롤링을 의도적으로
          # 건너뛴 것(steps.run이 "skipped")이라 outcome은 success가 아니지만,
          # 이는 실패가 아니라 "이번 시간대 데이터가 이미 정상적으로 있어서
          # 중복 수집을 피한 정상 상태"입니다. 그래서 outcome=success이거나
          # already_collected=true인 서점을 모두 "정상"으로 집계합니다.
          declare -A outcomes=(
            ["Kyobo Realtime"]="${{ needs.kyobo-realtime.outputs.outcome }}"
            ["Yes24 Realtime"]="${{ needs.yes24-realtime.outputs.outcome }}"
            ["Aladin Realtime"]="${{ needs.aladin-realtime.outputs.outcome }}"
          )
          declare -A already_collected=(
            ["Kyobo Realtime"]="${{ needs.kyobo-realtime.outputs.already_collected }}"
            ["Yes24 Realtime"]="${{ needs.yes24-realtime.outputs.already_collected }}"
            ["Aladin Realtime"]="${{ needs.aladin-realtime.outputs.already_collected }}"
          )

          echo "=== 실시간 수집 서점별 결과 ==="
          ok_count=0
          for name in "${!outcomes[@]}"; do
            outcome="${outcomes[$name]}"
            skipped="${already_collected[$name]}"
            if [ "$outcome" = "success" ]; then
              echo "  - ${name}: success (이번 회차 신규 수집 완료)"
              ok_count=$((ok_count + 1))
            elif [ "$skipped" = "true" ]; then
              echo "  - ${name}: skipped (이번 시간대 데이터가 이미 있어 정상적으로 건너뜀)"
              ok_count=$((ok_count + 1))
            else
              echo "  - ${name}: ${outcome:-(job 실패로 실행되지 않음)}"
            fi
          done

          echo ""
          echo "정상(success 또는 skipped) 서점 수: ${ok_count} / ${#outcomes[@]}"

          if [ "$ok_count" -eq 0 ]; then
            echo "::error::3개 서점 실시간 수집이 전부 실패했습니다. 워크플로를 실패로 표시합니다."
            exit 1
          fi

          echo "최소 1개 이상의 서점이 정상(success 또는 skipped)입니다."
