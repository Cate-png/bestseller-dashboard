name: Realtime Bestseller Collection

# 실시간 베스트셀러(교보문고 "실시간 베스트셀러", 예스24 "실시간베스트",
# 알라딘 "지금 베스트") 전용 워크플로입니다. 기존 collect.yml(매일 06시
# KST, 주간/분야별 수집)과는 완전히 별개이며, 서로 다른 파일이라 이 파일이
# 실패하거나 스케줄이 바뀌어도 collect.yml에는 전혀 영향이 없습니다.
# 매시간 실행됩니다. 저장 대상도 realtime_rankings/realtime_collection_runs
# 테이블로 완전히 분리되어 있어 주간 rankings 테이블과 섞이지 않습니다.
#
# 서점별로 job을 분리해 병렬 실행합니다(collect.yml과 동일한 구조).
#
# cron을 매시 정각(0분)이 아니라 1분으로 잡은 이유: GitHub Actions의
# schedule 트리거는 "매시 정각"에 부하가 집중되어 지연될 수 있다고 공식
# 문서에 명시되어 있고(Troubleshooting workflows), 실제로 이 워크플로의
# 최근 실행 이력을 조사해보니 정각(0분) 스케줄 실행의 과반수가 45분 이상
# 지연되고 있었습니다(중앙값 46분). 1분으로 옮기면 그 혼잡 구간을 피해갈
# 수 있습니다.
#
# 2026-08-23: 그런데도 GitHub Actions schedule 자체가 특정 회차를 통째로
# 건너뛰는 사례가 실제로 반복 확인됐습니다(예: 13:01 회차가 발화조차 되지
# 않아 13시 데이터가 아예 비어 사이트에 12:31 데이터가 남아있던 문제).
# 그래서 05분 간격(매시 01,06,11,16,21,26,31,36,41,46,51,56분)으로
# 스케줄을 촘촘하게 잡아, 특정 회차가 지연/누락돼도 같은 시간대 안에서
# 다음 실행이 곧바로 보충하도록 바꿨습니다. 다만 실행될 때마다 무조건
# 크롤링하면 같은 시간대에 최대 12번 중복 수집이 일어나므로, 각 job이
# 크롤링 직전에 check_realtime_hour_collected.py로 "내 서점의 이번
# KST 시간대 데이터가 이미 realtime_rankings에 있는지"를 먼저 확인하고,
# 있으면 크롤링 스텝을 건너뜁니다(아래 각 job의 "Check ..." 스텝 참고).
# 이미 있는 시간대는 다시 수집하지 않고, 없는 시간대만 채우므로 "같은
# 시간대에는 정상적인 3사 데이터 세트가 한 번만 생성된다"는 목표가
# 유지됩니다. collected_at은 여전히 각 스크립트가
# datetime.now(timezone.utc)로 "실제 수집을 시작한 시각"을 그대로
# 기록하고, Dashboard.jsx의 시간대별(00~23시) 조회 로직도 손대지
# 않았습니다.
#
# concurrency: 5분 간격이라 이전 실행이 끝나기 전에 다음 schedule이 겹칠
# 수 있습니다. cancel-in-progress를 쓰면 크롤링이 중간에 끊겨 일부
# 서점만 저장된 반쪽 상태가 될 수 있으므로, 대신 큐잉(줄서기) 방식을
# 씁니다 - 실행 중인 워크플로는 절대 취소되지 않고, 다음 실행은 그
# 워크플로가 끝난 뒤에 시작됩니다(그 사이에 새로 대기열에 들어온 실행이
# 더 있으면 그중 가장 최신 것만 남고 나머지 "아직 시작하지 않은" 대기는
# 자동으로 대체됩니다 - 이미 시작된 크롤링을 끊는 것과는 다릅니다).
on:
  schedule:
    - cron: "1,6,11,16,21,26,31,36,41,46,51,56 * * * *"
  workflow_dispatch:

concurrency:
  group: realtime-collection
  cancel-in-progress: false

jobs:
  kyobo-realtime:
    runs-on: ubuntu-latest
    outputs:
      outcome: ${{ steps.run.outcome }}
      already_collected: ${{ steps.check.outputs.already_collected }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install supabase playwright
          playwright install chromium

      - name: Check if this hour is already collected
        id: check
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python check_realtime_hour_collected.py "교보문고"

      - name: Run Kyobo Realtime
        id: run
        if: steps.check.outputs.already_collected != 'true'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python test_save_kyobo_realtime.py

  yes24-realtime:
    runs-on: ubuntu-latest
    outputs:
      outcome: ${{ steps.run.outcome }}
      already_collected: ${{ steps.check.outputs.already_collected }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install supabase playwright beautifulsoup4
          playwright install chromium

      - name: Check if this hour is already collected
        id: check
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python check_realtime_hour_collected.py "예스24"

      - name: Run Yes24 Realtime
        id: run
        if: steps.check.outputs.already_collected != 'true'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python test_save_yes24_realtime.py

  aladin-realtime:
    runs-on: ubuntu-latest
    outputs:
      outcome: ${{ steps.run.outcome }}
      already_collected: ${{ steps.check.outputs.already_collected }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install supabase playwright beautifulsoup4
          playwright install chromium

      - name: Check if this hour is already collected
        id: check
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python check_realtime_hour_collected.py "알라딘"

      - name: Run Aladin Realtime
        id: run
        if: steps.check.outputs.already_collected != 'true'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python test_save_aladin_realtime.py

  check-overall:
    needs: [kyobo-realtime, yes24-realtime, aladin-realtime]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check overall realtime collection result
        run: |
          # already_collected=true인 서점은 이번 실행에서 크롤링을 의도적으로
          # 건너뛴 것(steps.run이 "skipped")이라 outcome은 success가 아니지만,
          # 이는 실패가 아니라 "이번 시간대 데이터가 이미 정상적으로 있어서
          # 중복 수집을 피한 정상 상태"입니다. 그래서 outcome=success이거나
          # already_collected=true인 서점을 모두 "정상"으로 집계합니다.
          declare -A outcomes=(
            ["Kyobo Realtime"]="${{ needs.kyobo-realtime.outputs.outcome }}"
            ["Yes24 Realtime"]="${{ needs.yes24-realtime.outputs.outcome }}"
            ["Aladin Realtime"]="${{ needs.aladin-realtime.outputs.outcome }}"
          )
          declare -A already_collected=(
            ["Kyobo Realtime"]="${{ needs.kyobo-realtime.outputs.already_collected }}"
            ["Yes24 Realtime"]="${{ needs.yes24-realtime.outputs.already_collected }}"
            ["Aladin Realtime"]="${{ needs.aladin-realtime.outputs.already_collected }}"
          )

          echo "=== 실시간 수집 서점별 결과 ==="
          ok_count=0
          for name in "${!outcomes[@]}"; do
            outcome="${outcomes[$name]}"
            skipped="${already_collected[$name]}"
            if [ "$outcome" = "success" ]; then
              echo "  - ${name}: success (이번 회차 신규 수집 완료)"
              ok_count=$((ok_count + 1))
            elif [ "$skipped" = "true" ]; then
              echo "  - ${name}: skipped (이번 시간대 데이터가 이미 있어 정상적으로 건너뜀)"
              ok_count=$((ok_count + 1))
            else
              echo "  - ${name}: ${outcome:-(job 실패로 실행되지 않음)}"
            fi
          done

          echo ""
          echo "정상(success 또는 skipped) 서점 수: ${ok_count} / ${#outcomes[@]}"

          if [ "$ok_count" -eq 0 ]; then
            echo "::error::3개 서점 실시간 수집이 전부 실패했습니다. 워크플로를 실패로 표시합니다."
            exit 1
          fi

          echo "최소 1개 이상의 서점이 정상(success 또는 skipped)입니다."
