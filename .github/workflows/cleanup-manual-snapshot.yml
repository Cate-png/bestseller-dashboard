name: Cleanup Manual Run Snapshot (One-off)

# 2026-08-25 11:44경(KST) 수동 workflow_dispatch 실행으로 잘못 생성된 종합
# TOP100 스냅샷 3건(run_id 88/90/91)만 정확히 골라 삭제하는 1회성 정리
# 워크플로입니다. cleanup_manual_run_snapshot.py 자체에 삭제 전 건수 검증
# 안전장치가 있고(예상값과 다르면 삭제하지 않고 중단), collection_runs
# 테이블은 건드리지 않습니다. 기존 collect.yml/collect-daily.yml/
# collect-realtime.yml과는 완전히 별개이며, 작업 완료 후 이 워크플로 파일과
# 스크립트는 삭제(revert)할 예정입니다.

on:
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install supabase

      - name: Cleanup manual run snapshot (run_id 88/90/91 only)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python cleanup_manual_run_snapshot.py
