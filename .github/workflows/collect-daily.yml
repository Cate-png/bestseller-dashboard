name: Daily Bestseller Collection

# 종합 일간 베스트셀러(rankings.category="일간") 전용 워크플로입니다.
# 기존 collect.yml(매일 07:00 KST, 주간/분야별 수집)과 collect-realtime.yml
# (30분 간격 실시간 수집)은 전혀 건드리지 않고, 이 파일에만 일간용 스케줄을
# 추가합니다.
#
# 실행 시각(KST 07:00, 하루 1회): 세 서점 모두 "일간/일별/어제 베스트"의
# 날짜 라벨은 자정(00:00 KST)이 지나면 곧바로 "어제"로 넘어가지만, 그 라벨
# 안의 실제 순위(교보 prstRnkn, 예스24 판매지수)는 자정 이후에도 하루 종일
# 계속 바뀝니다 - 2026-08-25 실측: 00:30 KST 수집분과 6시간 30분 뒤(08:51
# KST), 그리고 다시 6시간 40분 뒤(08:55 KST, 총 두 시점)까지 같은 날짜
# ("2026.08.24"/"24일") 라벨의 실제 목록을 비교했더니 TOP20 중 교보는
# 12자리, 예스24는 16자리가 바뀌거나 아예 빠졌음(예: 교보 3위 "오디세이"가
# 45위로, 예스24 9위 "미국 성장주 처음 투자"가 87위로 하락). 즉 자정 직후
# 짧은 배치 지연 문제가 아니라 그날치 순위 자체가 하루 종일 유동적인 것이고,
# 정해진 시각도 이 유동 구간 안에 있어 완전히 "확정된" 값을 보장하지는
# 않습니다. 그럼에도 하루 1회, 매일 같은 시각에 수집한다는 단순함과
# 예측 가능성을 우선해 이 시각으로 고정합니다(사용자 결정, 2026-08-25).
#
# 서점별로 job을 분리해서 병렬 실행합니다(collect.yml과 동일한 구조).
#
# 2026-08-26: GitHub Actions 자체 schedule 트리거(위 문서에서는 "하루
# 1회는 몇 분 지연되어도 지장이 없다"고 판단해 계속 썼음)를 제거하고
# collect.yml/collect-realtime.yml과 동일하게 cron-job.org가 매일 07:00
# KST에 workflow_dispatch를 직접 호출하는 방식으로 바꿨습니다. 실측으로
# 첫 schedule 발화가 의도한 06:00이 아니라 약 20시간 지연된 새벽 02:15
# KST에 일어났고(GitHub 공식 문서의 "고부하 시 지연/드롭" 그대로), 그
# 결과 다음날 정상 시각(06:56 KST) 수집분과 비교한 rank_change가 "24시간
# 전"이 아니라 "28시간 40분 전, 그것도 다른 시간대"와 비교되면서 예스24
# 자체 페이지의 "전일 대비" 표시와 어긋나는 문제로 이어졌습니다("하루
# 1회는 지연돼도 괜찮다"는 이전 판단이 실제로는 등락 계산의 정확성에
# 영향을 준다는 것이 확인된 것 - 사용자 결정, 2026-08-26). 수집/저장
# 로직, DB 스키마는 전혀 건드리지 않았습니다.

on:
  workflow_dispatch:

jobs:
  kyobo-daily:
    runs-on: ubuntu-latest
    outputs:
      outcome: ${{ steps.run.outcome }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install supabase playwright
          playwright install chromium

      - name: Run Kyobo Daily
        id: run
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python test_save_kyobo_daily.py

  yes24-daily:
    runs-on: ubuntu-latest
    outputs:
      outcome: ${{ steps.run.outcome }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install supabase playwright beautifulsoup4
          playwright install chromium

      - name: Run Yes24 Daily
        id: run
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python test_save_yes24_daily.py

  aladin-daily:
    runs-on: ubuntu-latest
    outputs:
      outcome: ${{ steps.run.outcome }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install beautifulsoup4 supabase playwright
          playwright install chromium

      - name: Run Aladin Daily
        id: run
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python test_save_aladin_daily.py

  check-overall:
    needs: [kyobo-daily, yes24-daily, aladin-daily]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check overall collection result
        run: |
          declare -A results=(
            ["Kyobo Daily"]="${{ needs.kyobo-daily.outputs.outcome }}"
            ["Yes24 Daily"]="${{ needs.yes24-daily.outputs.outcome }}"
            ["Aladin Daily"]="${{ needs.aladin-daily.outputs.outcome }}"
          )

          echo "=== 일간 수집 서점별 결과 ==="
          success_count=0
          for name in "${!results[@]}"; do
            outcome="${results[$name]}"
            echo "  - ${name}: ${outcome:-(job 실패로 실행되지 않음)}"
            if [ "$outcome" = "success" ]; then
              success_count=$((success_count + 1))
            fi
          done

          echo ""
          echo "성공한 서점 수: ${success_count} / ${#results[@]}"

          if [ "$success_count" -eq 0 ]; then
            echo "::error::3개 서점 일간 수집이 전부 실패했습니다. 워크플로를 실패로 표시합니다."
            exit 1
          fi

          echo "최소 1개 이상의 수집이 성공했습니다."
