name: Daily Bestseller Collection

# 종합 일간 베스트셀러(rankings.category="일간") 전용 워크플로입니다.
# 기존 collect.yml(매일 06:30 KST, 주간/분야별 수집)과 collect-realtime.yml
# (30분 간격 실시간 수집)은 전혀 건드리지 않고, 이 파일에만 일간용 스케줄을
# 추가합니다.
#
# 실행 시각(KST 00:30): 세 서점 모두 "일간/일별/어제 베스트"가 "어제 하루
# 전체"를 집계하는 방식이라(실측 확인 - 교보 "온라인 일간", 예스24 "일별",
# 알라딘 "어제 베스트" 모두 전날 하루 판매 기준) 자정(00:00 KST)이 지나야
# 그날 몫이 채워집니다. 이번 조사에서는 실제 자정 전후 갱신 시각까지는
# 확인하지 못했고(다음날 자정을 넘겨 관찰해야 확인 가능), 각 사이트가
# 보통 자정 직후 짧은 배치 처리 시간을 두는 통상적인 패턴을 감안해 00:00
# 대신 00:30으로 30분의 여유를 둡니다. 실제 운영해보면서 특정 서점이
# 이 시각에 아직 전날 데이터로 안 바뀌어 있는 것이 확인되면(즉 하루 전
# 회차와 완전히 동일한 데이터가 반복 저장되면) 시각을 더 늦추는 조정이
# 필요합니다.
#
# 서점별로 job을 분리해서 병렬 실행합니다(collect.yml과 동일한 구조).
# 하루 1회면 충분하므로 collect-realtime.yml처럼 외부 cron 서비스를 쓰지
# 않고 GitHub Actions 기본 schedule 트리거를 그대로 씁니다(collect.yml과
# 동일 - schedule 지연/드롭 이슈는 30분 간격처럼 촘촘한 트리거에서만
# 문제가 되고, 하루 1회는 몇 분 지연되어도 지장이 없음).

on:
  schedule:
    - cron: "30 15 * * *"
  workflow_dispatch:

jobs:
  kyobo-daily:
    runs-on: ubuntu-latest
    outputs:
      outcome: ${{ steps.run.outcome }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install supabase playwright
          playwright install chromium

      - name: Run Kyobo Daily
        id: run
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python test_save_kyobo_daily.py

  yes24-daily:
    runs-on: ubuntu-latest
    outputs:
      outcome: ${{ steps.run.outcome }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install supabase playwright beautifulsoup4
          playwright install chromium

      - name: Run Yes24 Daily
        id: run
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python test_save_yes24_daily.py

  aladin-daily:
    runs-on: ubuntu-latest
    outputs:
      outcome: ${{ steps.run.outcome }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install beautifulsoup4 supabase playwright
          playwright install chromium

      - name: Run Aladin Daily
        id: run
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python test_save_aladin_daily.py

  check-overall:
    needs: [kyobo-daily, yes24-daily, aladin-daily]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check overall collection result
        run: |
          declare -A results=(
            ["Kyobo Daily"]="${{ needs.kyobo-daily.outputs.outcome }}"
            ["Yes24 Daily"]="${{ needs.yes24-daily.outputs.outcome }}"
            ["Aladin Daily"]="${{ needs.aladin-daily.outputs.outcome }}"
          )

          echo "=== 일간 수집 서점별 결과 ==="
          success_count=0
          for name in "${!results[@]}"; do
            outcome="${results[$name]}"
            echo "  - ${name}: ${outcome:-(job 실패로 실행되지 않음)}"
            if [ "$outcome" = "success" ]; then
              success_count=$((success_count + 1))
            fi
          done

          echo ""
          echo "성공한 서점 수: ${success_count} / ${#results[@]}"

          if [ "$success_count" -eq 0 ]; then
            echo "::error::3개 서점 일간 수집이 전부 실패했습니다. 워크플로를 실패로 표시합니다."
            exit 1
          fi

          echo "최소 1개 이상의 수집이 성공했습니다."
