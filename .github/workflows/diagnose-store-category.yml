name: Diagnose Store Category State (One-off, Read-only)

# run_id 88/90/91(오늘 11:44경 잘못된 수동 실행분) 삭제 후, 각 서점의 현재
# 최신 종합(category="종합") 스냅샷에서 store_category가 실제로 NULL인지
# 확인하기 위한 1회성 읽기 전용 진단 워크플로입니다.
# diagnose_store_category_state.py는 SELECT만 수행하고 Supabase에 아무것도
# 쓰지 않습니다. 확인 후 이 워크플로 파일과 스크립트는 삭제(revert)할
# 예정입니다.

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install supabase

      - name: Diagnose store_category state (read-only)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python diagnose_store_category_state.py
