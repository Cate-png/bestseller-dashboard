name: Bestseller Collection

# 서점별(교보/예스24/알라딘)로 job을 분리해서 서로 병렬로 실행합니다.
# 각 job 내부에서는 "종합 수집 -> 해당 서점의 분야별 수집" 순서를 유지합니다
# (같은 서점 사이트에 종합/분야별이 동시에 요청을 보내지 않도록). 서로 다른
# 서점끼리는 완전히 독립적인 job이라 한 서점이 실패해도 다른 서점에는 영향이
# 없고(GitHub Actions job은 원래도 서로 독립적으로 실행됨), continue-on-error로
# 같은 서점 안에서도 종합이 실패하면 분야별로 넘어가도록 유지했습니다.
#
# 실행 주기(2026-08-30부터 하루 2회, 12시간 간격): 교보문고 "주간" 랭킹이
# 실제로는 일주일에 한 번이 아니라 하루 중에도 다시 계산된다는 게 실측으로
# 확인됨(교보 소설 분야: 07:00 KST 수집분 8위·10위 상승 vs 같은 날 14:03
# KST 교보 실제 페이지 3위·5위 상승 - 등락 기준값이 8→8로 정확히 맞물려
# 같은 날 안에 재계산됐음을 확인. 3분 간격 재수집으로는 변화 없어 분
# 단위로 실시간 갱신되는 것은 아님). 하루 1회(07:00 KST) 스냅샷만으로는
# 오후에 어긋나는 정도가 커서, 07:00/19:00 KST 하루 2회로 늘림(사용자
# 결정, 2026-08-30). 이 워크플로 자체(job 구조, 크롤링/저장 로직)는
# collect-realtime.yml/collect-daily.yml과 동일하게 여전히 cron-job.org
# 같은 외부 서비스가 workflow_dispatch를 "호출해줄 때"만 실행되므로,
# 실제로 하루 2회 도착하려면 cron-job.org 쪽 스케줄도 (기존 "매일 07:00
# KST" 1개에서) "07:00 KST(=22:00 UTC 전날)/19:00 KST(=10:00 UTC)
# 각각 1번씩, 총 2개"로 사용자가 직접 추가해야 합니다. 이 저장소 안의
# 변경만으로는 자동으로 반영되지 않습니다.

on:
  workflow_dispatch:

jobs:
  kyobo:
    runs-on: ubuntu-latest
    outputs:
      total_outcome: ${{ steps.total.outcome }}
      category_outcome: ${{ steps.category.outcome }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install supabase playwright
          playwright install chromium

      - name: Run Kyobo
        id: total
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python test_save_kyobo.py

      - name: Run Kyobo Categories
        id: category
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python test_save_kyobo_category.py

  yes24:
    runs-on: ubuntu-latest
    outputs:
      total_outcome: ${{ steps.total.outcome }}
      category_outcome: ${{ steps.category.outcome }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests supabase playwright
          playwright install chromium

      - name: Run Yes24
        id: total
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          YES24_API_KEY: "${{ secrets.YES24_API_KEY }}"
        run: python test_save_yes24.py

      - name: Run Yes24 Categories
        id: category
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          YES24_API_KEY: "${{ secrets.YES24_API_KEY }}"
        run: python test_save_yes24_category.py

  aladin:
    runs-on: ubuntu-latest
    outputs:
      total_outcome: ${{ steps.total.outcome }}
      category_outcome: ${{ steps.category.outcome }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install beautifulsoup4 supabase playwright
          playwright install chromium

      - name: Run Aladin
        id: total
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python test_save_aladin.py

      - name: Run Aladin Categories
        id: category
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python test_save_aladin_category.py

  # 위 3개 job 모두에 continue-on-error를 쓴 스텝이 들어있어서, job 자체는
  # (checkout/setup/install만 성공하면) 대체로 "success"로 끝납니다. 그래서
  # 실제 수집 성공 여부는 job의 성공 여부가 아니라 각 job이 노출한
  # total_outcome/category_outcome 값으로 판단합니다. 6개 중 하나라도
  # success면 워크플로 전체는 success, 6개 다 실패하면 이 job에서 명시적으로
  # exit 1 처리해서 "전체 실패인데 녹색 성공"으로 보이는 상황을 막습니다.
  check-overall:
    needs: [kyobo, yes24, aladin]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check overall collection result
        run: |
          declare -A results=(
            ["Kyobo"]="${{ needs.kyobo.outputs.total_outcome }}"
            ["Kyobo Categories"]="${{ needs.kyobo.outputs.category_outcome }}"
            ["Yes24"]="${{ needs.yes24.outputs.total_outcome }}"
            ["Yes24 Categories"]="${{ needs.yes24.outputs.category_outcome }}"
            ["Aladin"]="${{ needs.aladin.outputs.total_outcome }}"
            ["Aladin Categories"]="${{ needs.aladin.outputs.category_outcome }}"
          )

          echo "=== 수집 스텝별 결과 ==="
          success_count=0
          for name in "${!results[@]}"; do
            outcome="${results[$name]}"
            echo "  - ${name}: ${outcome:-(job 실패로 실행되지 않음)}"
            if [ "$outcome" = "success" ]; then
              success_count=$((success_count + 1))
            fi
          done

          echo ""
          echo "성공한 스텝 수: ${success_count} / ${#results[@]}"

          if [ "$success_count" -eq 0 ]; then
            echo "::error::6개 수집 스텝이 전부 실패했습니다. 워크플로를 실패로 표시합니다."
            exit 1
          fi

          echo "최소 1개 이상의 수집이 성공했습니다."
